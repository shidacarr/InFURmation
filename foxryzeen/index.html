<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fox Ryzeen - InFURmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Griffy&family=Montenegrin+Gothic+One&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rojo: #ad0e1e;
      --rojo-brillo: #d11428;
      --purpura: #660d9e;
      --purpura-brillo: #8514c8;
      --negro: #302f30;
      --negro-claro: #3d3c3d;
      --blanco: #ffffff;
      --cream: #f5e6ff;
      --radius-card: 22px;
      --radius-avatar: 30%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: 'Montenegrin Gothic One', sans-serif;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      background: var(--negro);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(173, 14, 30, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(102, 13, 158, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(173, 14, 30, 0.12) 0%, transparent 60%),
        linear-gradient(135deg, #1f1e1f 0%, var(--negro) 50%, #1f1e1f 100%);
      pointer-events: none;
    }

    .estrella {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      width: 16px;
      height: 16px;
      background: currentColor;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      opacity: 0.55;
      animation: twinkle 4s ease-in-out infinite;
    }

    .estrella.h1 { top: 12%; left: 12%; color: var(--rojo-brillo); animation-delay: 0s; }
    .estrella.h2 { top: 18%; right: 14%; color: var(--cream); animation-delay: 0.5s; }
    .estrella.h3 { bottom: 24%; left: 8%; color: var(--purpura-brillo); animation-delay: 1s; }
    .estrella.h4 { bottom: 16%; right: 10%; color: var(--rojo-brillo); animation-delay: 1.5s; }
    .estrella.h5 { top: 40%; left: 5%; color: var(--cream); animation-delay: 0.3s; }
    .estrella.h6 { top: 46%; right: 6%; color: var(--purpura-brillo); animation-delay: 0.8s; }
    .estrella.h7 { bottom: 38%; left: 22%; color: var(--rojo-brillo); animation-delay: 1.2s; }
    .estrella.h8 { bottom: 42%; right: 18%; color: var(--cream); animation-delay: 1.7s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.15); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: center;
      padding: 0 10px;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(48, 47, 48, 0.96);
      border: 1px solid rgba(245, 230, 255, 0.14);
      border-radius: var(--radius-card);
      padding: 40px 28px 32px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(245, 230, 255, 0.04) inset,
        0 20px 60px -15px rgba(0, 0, 0, 0.85),
        0 0 50px -18px rgba(173, 14, 30, 0.35),
        0 0 80px -30px rgba(102, 13, 158, 0.25);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--rojo), var(--purpura), var(--rojo));
    }

    .avatar-ring {
      --ring-size: 170px;
      --ring-radius: 24px;
      position: relative;
      width: var(--ring-size);
      height: var(--ring-size);
      margin: 0 auto 26px;
      border-radius: var(--ring-radius);
      padding: 5px;
      background: linear-gradient(135deg, var(--rojo-brillo), var(--purpura-brillo));
      box-shadow:
        0 0 0 2px rgba(48, 47, 48, 0.8),
        0 0 30px rgba(173, 14, 30, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-ring::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: calc(var(--ring-radius) - 2px);
      background: var(--negro);
      z-index: 0;
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      border-radius: calc(var(--ring-radius) - 4px);
      background: linear-gradient(135deg, var(--rojo), var(--purpura));
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.1);
      display: block;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--rojo-brillo);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .nombre {
      font-family: 'Griffy', cursive;
      font-weight: 400;
      font-size: 34px;
      color: var(--blanco);
      letter-spacing: 0.01em;
      margin-bottom: 14px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      line-height: 1.1;
    }

    .rol {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      margin: 0 auto 12px;
      background: rgba(173, 14, 30, 0.18);
      border: 1px solid rgba(245, 230, 255, 0.18);
      border-radius: 999px;
      font-size: 12px;
      color: var(--cream);
      font-weight: 500;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .rol:hover {
      border-color: var(--rojo-brillo);
      background: rgba(173, 14, 30, 0.28);
    }

    .rol-punto {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--rojo-brillo);
      box-shadow: 0 0 8px var(--rojo-brillo);
    }

    .pronombre {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      margin: 0 auto 26px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(245, 230, 255, 0.12);
      border-radius: 999px;
      font-size: 12px;
      color: var(--cream);
      transition: border-color 0.2s ease;
    }

    .pronombre:hover {
      border-color: var(--rojo-brillo);
    }

    .pronombre-flag {
      font-size: 14px;
      line-height: 1;
    }

    .pronombre-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: rgba(245, 230, 255, 0.55);
    }

    .pronombre-punto {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--rojo-brillo);
      opacity: 0.85;
    }

    .pronombre-valor {
      color: var(--blanco);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245, 230, 255, 0.35), transparent);
      margin-bottom: 24px;
    }

    .redes {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .red {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(245, 230, 255, 0.1);
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .red:hover {
      border-color: var(--rojo-brillo);
      background: rgba(173, 14, 30, 0.15);
      transform: translateY(-2px);
    }

    .red:active {
      transform: scale(0.98);
    }

    .red-icono {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: var(--rojo-brillo);
      filter: drop-shadow(0 0 4px rgba(173, 14, 30, 0.35));
    }

    .red-texto {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .red-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(245, 230, 255, 0.55);
      font-weight: 500;
    }

    .red-valor {
      font-size: 14px;
      color: var(--blanco);
      font-weight: 500;
    }

    .minicarta {
      margin-top: 24px;
      padding: 20px;
      background: linear-gradient(180deg, rgba(173, 14, 30, 0.14) 0%, rgba(48, 47, 48, 0) 100%);
      border: 1px solid rgba(245, 230, 255, 0.1);
      border-left: 3px solid var(--rojo-brillo);
      border-radius: 12px;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .minicarta::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 100% 0%, rgba(173, 14, 30, 0.22), transparent 70%);
      pointer-events: none;
    }

    .minicarta-eyebrow {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--rojo-brillo);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .minicarta-eyebrow::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--rojo-brillo), transparent);
      opacity: 0.55;
    }

    .minicarta-texto {
      font-size: 14px;
      line-height: 1.75;
      color: rgba(245, 230, 255, 0.95);
      font-weight: 400;
    }

    .footer {
      margin-top: 28px;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: rgba(245, 230, 255, 0.45);
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: subir 0.5s ease; }
      @keyframes subir {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    }

    @media (max-width: 520px) {
      .estrella { opacity: 0.35; width: 12px; height: 12px; }
    }

    @media (max-width: 420px) {
      .wrap { padding: 0 4px; }
      .card { padding: 32px 16px 28px; border-radius: 18px; }
      .avatar-ring { --ring-size: 140px; margin-bottom: 20px; }
      .nombre { font-size: 28px; }
      .minicarta { padding: 16px; }
      .minicarta-texto { font-size: 13px; }
    }

    @media (max-width: 340px) {
      body { padding: 16px 8px; }
      .card { padding: 26px 14px 24px; }
      .avatar-ring { --ring-size: 120px; margin-bottom: 18px; }
      .nombre { font-size: 24px; }
      .rol { font-size: 11px; padding: 5px 12px; }
      .minicarta-texto { font-size: 12px; }
    }

    @media (min-width: 768px) {
      body { padding: 32px 24px; }
      .wrap { max-width: 520px; }
      .card { max-width: 480px; padding: 48px 34px 38px; }
      .avatar-ring { --ring-size: 190px; margin-bottom: 28px; }
      .nombre { font-size: 38px; }
      .minicarta { padding: 22px; }
      .redes { gap: 12px; }
      .red { padding: 14px 18px; }
    }
  </style>
</head>
