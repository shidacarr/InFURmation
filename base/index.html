<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta Base</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Poppins:wght@500;700&display=swap');

    :root {
      --bg-page: #2bb4d6;
      --bg-card: #ffffff;
      --color-outline: #1b264f;
      --color-accent: #00e5ff;
      --color-accent-light: #ccfaff;
      --color-text-muted: #536493;
      --font-body: 'Nunito', sans-serif;
      --font-display: 'Poppins', sans-serif;
      --card-max-width: 420px;
      --card-radius: 24px;
      --card-padding: 36px 28px 30px;
      --ring-size: 170px;
      --radius-avatar: 24px;
      --eyebrow-size: 18px;
      --nombre-size: 42px;
      --pronoun-size: 12px;
      --bio-size: 12.5px;
      --avatar-img: url('');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: var(--font-body);
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      background: var(--bg-page);
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: center;
      padding: 0 10px;
    }

    .card {
      position: relative;Tu subtítulo
Tu Nombre
      width: 100%;
      max-width: var(--card-max-width);
      background: var(--bg-card);
      border: 3px solid var(--color-outline);
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      text-align: center;
      box-shadow: 6px 6px 0 rgba(27, 38, 79, 0.15);
      color: var(--color-outline);
    }

    .avatar-ring {
      position: relative;
      width: var(--ring-size);
      height: var(--ring-size);
      margin: 0 auto 26px;
      border-radius: var(--radius-avatar);
      padding: 6px;
      background: var(--color-accent);
      border: 3px solid var(--color-outline);
      box-shadow: 4px 4px 0 var(--color-outline);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-ring::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: calc(var(--radius-avatar) - 3px);
      background: var(--bg-card);
      border: 2px solid var(--color-outline);
      z-index: 0;
    }

    .avatar {
      position: relative;
      z-index: 1;
      width: calc(100% - 16px);
      height: calc(100% - 16px);
      border-radius: calc(var(--radius-avatar) - 5px);
      background-color: var(--color-accent-light);
      background-image: var(--avatar-img);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      border: 2px solid var(--color-outline);
    }

    .avatar::after {
      content: "?";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 700;
      color: var(--color-outline);
      opacity: 0.25;
      pointer-events: none;
    }

    .eyebrow {
      font-size: var(--eyebrow-size);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }

    .nombre {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--nombre-size);
      line-height: 1.1;
      color: var(--color-outline);
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    .pronombre {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 6px 10px;
      margin: 0 auto 22px;
      background: var(--bg-card);
      border: 2px solid var(--color-outline);
      border-radius: 999px;
      font-size: var(--pronoun-size);
      font-weight: 700;
      box-shadow: 2px 2px 0 var(--color-outline);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .pronombre:hover {
      background: var(--color-accent-light);
      transform: translate(-1px, -1px);
    }
    .pronombre-flag { font-size: 13px; line-height: 1; }
    .pronombre-label {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--color-text-muted);
    }
    .pronombre-valor {
      color: var(--color-outline);
      font-weight: 800;
      letter-spacing: 0.01em;
    }
    .pronombre-punto {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-accent);
      border: 1px solid var(--color-outline);
    }

    .divider {
      height: 3px;
      background: var(--color-outline);
      border-radius: 2px;
      margin-bottom: 24px;
      opacity: 0.2;
    }

    .redes {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .red {
      display: flex;Tu subtítulo
Tu Nombre
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 2px solid var(--color-outline);
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 3px 3px 0 var(--color-outline);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .red:hover {
      background: var(--color-accent-light);
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--color-outline);
    }
    .red:active { transform: translate(1px, 1px); }

    .red-icono {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--color-outline);
    }

    .red-texto {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .red-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
    }

    .red-valor {
      font-size: 14px;
      color: var(--color-outline);
      font-weight: 700;
    }

    .minicarta {
      margin-top: 22px;
      padding: 16px 18px;
      background: var(--bg-card);
      border: 2px solid var(--color-outline);
      border-left: 6px solid var(--color-accent);
      border-radius: 12px;
      text-align: left;
      position: relative;
      overflow: hidden;
      box-shadow: 3px 3px 0 var(--color-outline);
    }
    .minicarta-eyebrow {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--color-outline);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .minicarta-eyebrow::after {
      content: "";
      flex: 1;
      height: 2px;
      background: var(--color-outline);
      opacity: 0.2;
      border-radius: 2px;
    }
    .minicarta-texto {
      font-size: var(--bio-size);
      line-height: 1.6;
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .footer {
      margin-top: 26px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: subir 0.5s ease; }
      @keyframes subir {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    }

    @media (max-width: 420px) {
      .wrap { padding: 0 4px; }
      .card { padding: 28px 16px 26px; border-radius: 20px; }
      .avatar-ring { --ring-size: 140px; margin-bottom: 20px; }
      .nombre { font-size: 32px; }
      .minicarta { padding: 14px; }
      .minicarta-texto { font-size: 12px; }
    }

    @media (max-width: 340px) {
      body { padding: 16px 8px; }
      .card { padding: 24px 14px 22px; }
      .avatar-ring { --ring-size: 120px; margin-bottom: 18px; }
      .nombre { font-size: 24px; }
      .pronombre { font-size: 11px; padding: 5px 10px 5px 8px; }
    }

    @media (min-width: 768px) {
      body { padding: 32px 24px; }
      .card { max-width: 480px; padding: 42px 34px 34px; }
      .avatar-ring { --ring-size: 190px; margin-bottom: 28px; }
      .nombre { font-size: 52px; }
      .minicarta { padding: 20px 22px; }
      .redes { gap: 12px; }
      .red { padding: 14px 18px; }
    }
  </style>
</head>
